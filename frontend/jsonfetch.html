<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>json/fetch</title>
	</head>
	<body>
		<h1>json/fetch</h1>
		<button onclick='llamar()'>Fectch</button>
		<button onclick='llamar2()'>XMLHttpRequest</button>
		<button onclick='llamar3()'>Fetch async-await</button>
		<button onclick='llamar4()'>Fetch picsum</button>
		<button onclick='llamar5()'>Saludador</button>

		<img id="id" src="">
		<script>
			function llamar() {
				url="https://jsonplaceholder.typicode.com/users/1";
				parametros="";
				fetch(url)
				.then(respuesta=>{
					usuario=respuesta.json()
					console.log(usuario.address)
					return usuario;
				})
				.then(datos=>{
					console.log(datos);
					u = datos;
					console.log(u.name);
				})
				.catch(error=>{
					console.log(error);
				})
			}
			
			function llamar2(){
				xhttp = new XMLHttpRequest();
				xhttp.onload = function(){
					usuario = JSON.parse(xhttp.response);
					console.log( usuario.name )
				}
				xhttp.open("GET","https://jsonplaceholder.typicode.com/users/1");
				xhttp.send();				
			}

			function llamar3(){
				url="https://jsonplaceholder.typicode.com/users/1";
				parametros="";
				fetch(url)
				.then(async respuesta=>{
					console.log("respuesta:");
					console.log(respuesta);
					usuario=await respuesta.json()
					console.log(usuario)
					return usuario;
				})
				.then(datos=>{
					console.log(datos);
					u = datos;
					console.log(u.name);
				})
				.catch(error=>{
					console.log(error);
				})
			}

			function llamar4(){
				url = "https://picsum.photos/id/1/200/200"
				fetch(url)
				.then(respuesta=>{
					console.log(respuesta)
					r = respuesta.blob()
					return r;
				})
				.then(datos=>{
					console.log(datos);
					d = URL.createObjectURL(datos);
					console.log(d);
					document.getElementById("id").src = d;
					}
				})
				.catch(error=>{
					console.log(error)
				})
			}

			function llamar5(){
				url = "http://localhost:8080/"
				fetch(url)
				.then(res=>{
					console.log(res);
				})
				.then(datos)
				.catch(error)
			}
		</script>
	<body>
</html>
