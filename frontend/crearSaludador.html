<html>
<head>
	<title>crearSaludador</title>
</head>
<body>
	<h1>Crear saludador</h1>
	<!--Este metodo de enviar informacion con el formulaario no sirve porque debemos enviar un objeto json 
	
	<form action="http://localhost:8080/crearSaludador" method="post">
		<input type="submit"></input>
	</form>
	-->
	<label for="nombre">Nombre:</label>
	<input type="text" id="nombre"></input>
	<button onclick="crear()">Crear</button>
	<script>
		function crear(){
			//no enviar objetos al backend; solo cadenas
			url="http://localhost:8080/crearSaludador"
			nombre = document.getElementById("nombre").value;
			let cuerpo = JSON.stringify({contenido: nombre});


			console.log(cuerpo);
			fetch(url, {
				method: 'POST',
				headers: {"Content-type":"application/json"},
				body: cuerpo
			})
			.then(async respuesta=>{
				console.log(await respuesta);
			})
			.then(datos=>{
				
			})
			.catch(error=>{
				
			});
		}
		</script>
</body>
</html>
